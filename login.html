<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ავტორიზაცია და რეგისტრაცია</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b132b;
            color: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(28, 37, 65, 0.85);
            backdrop-filter: blur(12px);
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
        }

        .role-switch {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .role-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .role-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group select option {
            background: #1c2541;
            color: #fff;
        }

        .email-wrapper {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        .email-wrapper input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 11px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .email-domain {
            padding: 0 12px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
            background: rgba(255, 255, 255, 0.05);
            height: 100%;
            display: flex;
            align-items: center;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="role-switch">
            <button type="button" class="role-btn active" onclick="switchTab('admin')">ადმინი</button>
            <button type="button" class="role-btn" onclick="switchTab('student-login')">შესვლა</button>
            <button type="button" class="role-btn" onclick="switchTab('student-register')">რეგისტრაცია</button>
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <!-- შესვლის ფორმა (ადმინი ან სტუდენტი) -->
        <form id="loginForm" action="/login" method="POST">
            <div class="input-group">
                <label id="usernameLabel" for="username">მომხმარებელი</label>
                <input type="text" name="username" id="username" placeholder="შეიყვანეთ ადმინის სახელი" required>
            </div>

            <div class="input-group">
                <label for="password">პაროლი</label>
                <input type="password" name="password" id="password" placeholder="შეიყვანეთ პაროლი" required>
            </div>

            <button type="submit" class="btn-submit">შესვლა</button>
        </form>

        <!-- ახალი სტუდენტის რეგისტრაციის ფორმა -->
        <form id="registerForm" action="/register" method="POST" class="hidden">
            <div class="input-group">
                <label for="reg_first_name">სახელი</label>
                <input type="text" name="first_name" id="reg_first_name" placeholder="შეიყვანეთ სახელი" required>
            </div>

            <div class="input-group">
                <label for="reg_last_name">გვარი</label>
                <input type="text" name="last_name" id="reg_last_name" placeholder="შეიყვანეთ გვარი" required>
            </div>

            <div class="input-group">
                <label for="reg_university">უნივერსიტეტი</label>
                <select name="university" id="reg_university" required onchange="updateEmailDomain()">
                    <option value="" disabled selected>აირჩიეთ უნივერსიტეტი</option>
                    <option value="iliauni">ილიას სახელმწიფო უნივერსიტეტი (ილიაუნი)</option>
                    <option value="gepi">საქართველოს ტექნიკური უნივერსიტეტი (გეპი)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="prefix_email">ელ-ფოსტა (მეილი)</label>
                <div class="email-wrapper">
                    <input type="text" name="prefix_email" id="prefix_email" placeholder="აირჩიეთ უნივერსიტეტი ჯერ" disabled required>
                    <span id="emailDomain" class="email-domain">@domain.ge</span>
                </div>
                <input type="hidden" name="email" id="email">
            </div>

            <div class="input-group">
                <label for="reg_password">პაროლი</label>
                <input type="password" name="password" id="reg_password" placeholder="შეიყვანეთ პაროლი" required>
            </div>

            <button type="submit" class="btn-submit" onclick="prepareSubmit(event)">რეგისტრაცია</button>
        </form>
    </div>

    <script>
        function switchTab(mode) {
            const btns = document.querySelectorAll('.role-btn');
            btns.forEach(b => b.classList.remove('active'));

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const usernameInput = document.getElementById('username');
            const usernameLabel = document.getElementById('usernameLabel');

            if (mode === 'admin') {
                btns[0].classList.add('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                usernameLabel.innerText = "მომხმარებელი";
                usernameInput.placeholder = "შეიყვანეთ ადმინის სახელი";
                usernameInput.type = "text";
            } else if (mode === 'student-login') {
                btns[1].classList.add('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                usernameLabel.innerText = "ელ-ფოსტა (მეილი)";
                usernameInput.placeholder = "შეიყვანეთ თქვენი მეილი";
                usernameInput.type = "email";
            } else if (mode === 'student-register') {
                btns[2].classList.add('active');
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }

        function updateEmailDomain() {
            const uni = document.getElementById('reg_university').value;
            const prefixInput = document.getElementById('prefix_email');
            const domainSpan = document.getElementById('emailDomain');

            prefixInput.disabled = false;

            if (uni === 'iliauni') {
                domainSpan.innerText = '@iliauni.edu.ge';
                prefixInput.placeholder = "თქვენი სახელი";
            } else if (uni === 'gepi') {
                domainSpan.innerText = '@gtu.ge';
                prefixInput.placeholder = "თქვენი სახელი";
            }
        }

        function prepareSubmit(event) {
            const prefix = document.getElementById('prefix_email').value.trim();
            const domain = document.getElementById('emailDomain').innerText;
            const fullEmailField = document.getElementById('email');

            if (!prefix) {
                alert('გთხოვთ შეიყვანოთ მეილის სახელი!');
                event.preventDefault();
                return false;
            }

            fullEmailField.value = prefix + domain;
            return true;
        }
    </script>
</body>
</html>
